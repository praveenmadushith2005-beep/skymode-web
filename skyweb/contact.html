<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Under Construction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            max-width: 450px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            padding: 45px 30px;
            overflow: hidden;
        }

        /* --- CSS Animation Section --- */
        .animation-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            height: 140px;
        }

        .circle-loader {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(49, 130, 206, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(49, 130, 206, 0.15);
            animation: pulse 2s infinite ease-in-out;
        }

        .code-icon {
            font-size: 34px;
            font-weight: 700;
            color: #3182ce;
            font-family: monospace;
            letter-spacing: -2px;
            animation: float 3s infinite ease-in-out;
        }

        .orbit-spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #3182ce;
            border-bottom-color: #3182ce;
            animation: spin 1.5s linear infinite;
        }

        /* Keyframes for the animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(49, 130, 206, 0.15); }
            50% { box-shadow: 0 0 45px rgba(49, 130, 206, 0.4); }
        }
        /* ----------------------------- */

        h1 {
            color: #2d3748;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #3182ce;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(49, 130, 206, 0.3);
        }

        .contact-btn:hover {
            background: #2b6cb0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(49, 130, 206, 0.4);
        }

        .contact-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ==================================================== */
        /* --- MOBILE RESPONSIVENESS FIXES (NO DESKTOP CHANGES) --- */
        /* ==================================================== */
        @media (max-width: 480px) {
            .card { padding: 30px 20px; margin: 0 10px; }
            h1 { font-size: 22px; }
            .circle-loader { width: 90px; height: 90px; }
            .animation-container { height: 110px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Pure CSS Animated Graphic -->
        <div class="animation-container">
            <div class="circle-loader">
                <div class="orbit-spinner"></div>
                <div class="code-icon">&lt;/&gt;</div>
            </div>
        </div>
        
        <h1 style="color: red;">Still Developing this page!</h1>
        <p>Sorry, we are currently working hard behind the scenes to bring you a better experience. Need immediate assistance?</p>
        
        <!-- Contact Button -->
        <a href="tel:+94741252178" class="contact-btn">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
            </svg>
            +94 74 125 2178
        </a>
    </div>

</body>
</html>
